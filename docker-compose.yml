services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: personal_finance_studio
      POSTGRES_USER: pfs
      POSTGRES_PASSWORD: pfs_local
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfs -d personal_finance_studio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
